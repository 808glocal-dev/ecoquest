<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f24"><meta name="description" content="포근한 별을 천천히 여행해요. 걸어도 좋고, 쉬어도 좋아요."><title>뽀송별 ☁️ — 작은 하루가 포근해지는 별</title><link rel="stylesheet" href="/game/style.css?v=3"></head><body>
<main id="world" aria-label="뽀송별 3D 우주 게임"><canvas id="game" aria-label="3D 별 여행 공간" tabindex="0"></canvas><div id="stars" aria-hidden="true"></div>
<header id="topbar"><div class="brand"><span class="emblem">☁️</span><div><strong>뽀송별</strong><small id="location">말없이 떠다니는 우주</small></div></div><div class="topright"><div class="impact"><span id="missionNumber">🌱 —회</span><span id="co2Number">약 —kg CO₂</span></div><button class="chip" id="loginBtn">로그인</button></div></header>
<div id="welcome"><div class="hero">서두르지 않아도 괜찮아</div><p>별을 만나러 천천히 떠나볼까요?</p><button id="start" class="primary">조용한 우주 여행 시작</button><small>미션을 하지 않아도 언제든 쉬어갈 수 있어요.</small></div>
<div id="approach" hidden><div class="planet-info"><small>조금 더 가까이</small><h1 id="planetName">초록숨별</h1><p id="planetInfo"></p><button class="primary" id="landBtn">이 별에 착륙하기</button><button class="quiet" id="backOrbit">다른 별 둘러보기</button></div></div>
<div id="leftTips" class="hint">마우스 드래그 · 우주 둘러보기<br>휠 · 확대/축소　행성 클릭 · 접근</div>
<div id="actions"><button class="pill" id="orbitBtn" hidden>🪐 우주로</button><button class="pill" id="sitBtn" hidden>🪑 앉기</button><button class="pill" id="nearBtn" hidden>📷 미션 장소</button><button class="pill" id="musicBtn">♫ 음악 켜기</button></div>
<div id="side"><button class="dock" data-panel="quests" aria-label="전체 미션"><span>🌱</span><small>미션</small></button><button class="dock" data-panel="records" aria-label="내 기록"><span>📖</span><small>기록</small></button><button class="dock" data-panel="shop" aria-label="별상점"><span>🏡</span><small>상점</small></button><button class="dock" data-panel="friends" aria-label="여행자"><span>🐰</span><small>친구</small></button><button class="dock" data-panel="guide" aria-label="도움말"><span>⚙️</span><small>안내</small></button></div>
<div id="touchPad" aria-label="이동 버튼"><button data-dir="w">↑</button><div><button data-dir="a">←</button><button data-dir="s">↓</button><button data-dir="d">→</button></div></div>
<div id="landingFX" aria-hidden="true"><span>☁️<small>별에 착륙하고 있어요…</small></span></div><div id="toast" role="status" aria-live="polite"></div>
<section id="panel" aria-label="게임 메뉴" hidden><div class="panel-heading"><div><small id="panelSubtitle">뽀송별</small><h2 id="panelTitle">메뉴</h2></div><button id="panelClose" aria-label="닫기">✕</button></div><div id="panelBody"></div></section>
</main><input type="file" id="photo" accept="image/jpeg,image/png,image/webp" capture="environment" hidden><script type="module" src="/game/main.js?v=3"></script></body></html>
